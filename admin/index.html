<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Panel · Reformas Dodo</title>
  <meta name="robots" content="noindex,nofollow"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <style>
    :root { --gd:#0f2d22; --go:#c9a84c; --off:#f7f6f3; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--off); }
    /* Personalización visual mínima del CMS */
    [data-slate-editor] { font-family: Georgia, serif; }
  </style>
</head>
<body>
  <!-- ══════════════════════════════════════════════
       Decap CMS 3.x — Panel de administración
       ══════════════════════════════════════════════ -->
  <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>

  <script>
    // ══════════════════════════════════════════════
    // Registro de previsualizaciones personalizadas
    // ══════════════════════════════════════════════
    // Muestra una preview visual real de cada imagen al editarla
    // en lugar del panel vacío por defecto.

    if (window.CMS) {
      CMS.registerPreviewStyle('/admin/preview.css');

      // ─────────────────────────────────────────
      // Preview de la colección "imagenes"
      // ─────────────────────────────────────────
      const ImagenPreview = createClass({
        render: function() {
          const entry = this.props.entry;
          const imagen = entry.getIn(['data', 'imagen']);
          const titulo = entry.getIn(['data', 'titulo']) || 'Sin título';
          const alt = entry.getIn(['data', 'alt']) || '';
          const categoria = entry.getIn(['data', 'categoria']) || '';
          const ubicacion = entry.getIn(['data', 'ubicacion']) || '';
          const orden = entry.getIn(['data', 'orden']);
          const publicado = entry.getIn(['data', 'publicado']);

          // Resuelve la ruta de la imagen desde el widget de Decap
          const imagenSrc = this.props.getAsset(imagen);

          return h('div', { style: { padding: '32px', background: '#f7f6f3', minHeight: '100vh', fontFamily: '-apple-system, sans-serif' } },
            h('div', { style: { maxWidth: '720px', margin: '0 auto', background: '#fff', borderRadius: '12px', overflow: 'hidden', boxShadow: '0 4px 24px rgba(0,0,0,.08)' } },
              // ── Imagen grande ──
              imagen
                ? h('div', { style: { position: 'relative', background: '#eee' } },
                    h('img', {
                      src: imagenSrc && imagenSrc.toString ? imagenSrc.toString() : '',
                      alt: alt,
                      style: { width: '100%', display: 'block', maxHeight: '480px', objectFit: 'cover' }
                    }),
                    h('div', {
                      style: {
                        position: 'absolute', top: '12px', right: '12px',
                        padding: '6px 12px', borderRadius: '20px',
                        background: publicado ? '#0f2d22' : '#999',
                        color: '#fff', fontSize: '12px', fontWeight: 600
                      }
                    }, publicado ? '✓ Publicada' : '⏸ Borrador')
                  )
                : h('div', { style: { padding: '80px 40px', textAlign: 'center', background: '#f0ebe0', color: '#888' } },
                    h('div', { style: { fontSize: '48px', marginBottom: '12px' } }, '📷'),
                    h('div', {}, 'Aún no has subido ninguna foto')
                  ),

              // ── Info ──
              h('div', { style: { padding: '24px 32px' } },
                categoria && h('div', {
                  style: {
                    display: 'inline-block', padding: '4px 12px', background: '#c9a84c',
                    color: '#0f2d22', fontSize: '11px', fontWeight: 700,
                    textTransform: 'uppercase', letterSpacing: '.1em',
                    borderRadius: '4px', marginBottom: '12px'
                  }
                }, categoria),
                h('h1', { style: { fontFamily: 'Georgia, serif', color: '#0f2d22', margin: '0 0 8px', fontSize: '28px' } }, titulo),
                ubicacion && h('div', { style: { color: '#666', fontSize: '14px', marginBottom: '16px' } }, '📍 ' + ubicacion),
                alt && h('div', {
                  style: {
                    padding: '12px 16px', background: '#f7f6f3',
                    borderLeft: '3px solid #c9a84c', fontSize: '13px',
                    color: '#4a6057', fontStyle: 'italic', margin: '16px 0'
                  }
                }, '🔍 Google verá: "' + alt + '"'),
                orden && h('div', { style: { fontSize: '12px', color: '#999', marginTop: '12px' } }, 'Orden en galería: #' + orden)
              )
            )
          );
        }
      });

      CMS.registerPreviewTemplate('imagenes', ImagenPreview);

      // ─────────────────────────────────────────
      // Preview de artículos del blog
      // ─────────────────────────────────────────
      const BlogPreview = createClass({
        render: function() {
          const entry = this.props.entry;
          const titulo = entry.getIn(['data', 'titulo']) || 'Sin título';
          const fecha = entry.getIn(['data', 'fecha']);
          const categoria = entry.getIn(['data', 'categoria']) || '';
          const resumen = entry.getIn(['data', 'resumen']) || '';
          const portada = entry.getIn(['data', 'portada']);
          const contenido = this.props.widgetFor('contenido');
          const portadaSrc = this.props.getAsset(portada);

          return h('div', { style: { padding: '32px', background: '#f7f6f3', minHeight: '100vh', fontFamily: 'Georgia, serif' } },
            h('article', { style: { maxWidth: '760px', margin: '0 auto', background: '#fff', borderRadius: '12px', overflow: 'hidden', boxShadow: '0 4px 24px rgba(0,0,0,.08)' } },
              portada && h('img', {
                src: portadaSrc && portadaSrc.toString ? portadaSrc.toString() : '',
                style: { width: '100%', maxHeight: '360px', objectFit: 'cover', display: 'block' }
              }),
              h('div', { style: { padding: '32px 40px' } },
                categoria && h('div', {
                  style: {
                    display: 'inline-block', padding: '4px 12px', background: '#c9a84c',
                    color: '#0f2d22', fontSize: '11px', fontWeight: 700,
                    textTransform: 'uppercase', letterSpacing: '.1em', borderRadius: '4px'
                  }
                }, categoria),
                h('h1', { style: { color: '#0f2d22', margin: '16px 0 8px', fontSize: '32px' } }, titulo),
                fecha && h('div', { style: { color: '#888', fontSize: '13px', marginBottom: '24px', fontFamily: '-apple-system, sans-serif' } }, new Date(fecha).toLocaleDateString('es-ES')),
                resumen && h('p', { style: { fontSize: '17px', lineHeight: 1.6, color: '#4a6057', fontStyle: 'italic', margin: '0 0 24px' } }, resumen),
                h('div', { style: { fontSize: '16px', lineHeight: 1.75, color: '#181a19' } }, contenido)
              )
            )
          );
        }
      });

      CMS.registerPreviewTemplate('blog', BlogPreview);
    }
  </script>
</body>
</html>
